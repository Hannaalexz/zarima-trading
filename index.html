<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zarima Trading — Cement &amp; Transport</title>
    <meta name="description" content="Minimal, elegant operations platform for cement trading, transport fleet, and corporate treasury." />
    <!-- Google Fonts: Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0D151D] text-foreground antialiased selection:bg-forest selection:text-white min-h-screen">
    <div id="root">
      <div style="min-height:100vh;background:#0D151D;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;color:#ffffff;padding:20px;text-align:center;">
        <div style="width:76px;height:76px;border-radius:20px;background:#0A1324;border:2px solid rgba(255,107,0,0.5);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,0.6);margin-bottom:20px;">
          <img src="/images/zarima_logo.jpg" alt="Zarima Trading Logo" style="width:100%;height:100%;object-fit:cover;" />
        </div>
        <div style="font-weight:900;font-size:20px;letter-spacing:0.12em;color:#ffffff;">ZARIMA TRADING PLC</div>
        <div style="font-size:11px;font-weight:700;letter-spacing:0.25em;color:#FF6B00;margin-top:6px;text-transform:uppercase;">Building a Stronger Tomorrow</div>
        <div style="margin-top:28px;width:160px;height:3px;background:rgba(255,255,255,0.12);border-radius:99px;overflow:hidden;position:relative;">
          <div style="width:70px;height:100%;background:#FF6B00;border-radius:99px;animation:zarimaPulse 1.1s infinite ease-in-out;"></div>
        </div>
        <div style="font-size:12px;color:rgba(255,255,255,0.5);margin-top:14px;font-weight:500;">Loading Zarima Operations Portal...</div>
        <style>
          @keyframes zarimaPulse {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(160px); }
            100% { transform: translateX(-100%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
